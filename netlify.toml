# Frontend → Netlify
# Leave "Base directory" EMPTY in the Netlify UI (this file sets client/).

[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-fund --no-audit"
  VITE_SERVER_URL = "https://property-voice-ai.onrender.com"

# SPA client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Mic needs a secure context; help browsers allow it on this origin
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
